<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>RunNear — สนามวิ่งใกล้ฉัน</title>

  <!-- ฟอนต์ -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
  />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #73dc4b;
      --primary-dark: #173c23;
      --primary-soft: #e0f8d6;
      --yellow: #ffc83d;
      --text: #13291c;
      --muted: #77847c;
      --border: #dde4de;
      --surface: #ffffff;
      --background: #eef2ee;
      --danger: #d64231;
      --shadow: 0 16px 45px rgba(18, 51, 30, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: "Noto Sans Thai", sans-serif;
      color: var(--text);
      background: #dfe5e0;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--background);
      box-shadow: 0 0 45px rgba(19, 41, 28, 0.16);
      display: flex;
      flex-direction: column;
    }

    /* ส่วนหัว */
    .header {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(76px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid rgba(221, 228, 222, 0.8);
      backdrop-filter: blur(16px);
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-logo {
      position: absolute;
      left: 18px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: #fff;
      background: var(--primary);
      border-radius: 13px;
      box-shadow: 0 6px 15px rgba(115, 220, 75, 0.35);
    }

    .header-logo i {
      width: 20px;
    }

    /* แผนที่ */
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #e7ece7;
    }

    .leaflet-control-zoom {
      display: none;
    }

    .leaflet-control-attribution {
      margin-bottom: 85px !important;
      padding: 2px 5px !important;
      font-size: 8px !important;
      border-radius: 6px 0 0;
    }

    /* ค้นหาและตัวกรอง */
    .search-panel {
      position: absolute;
      top: calc(88px + env(safe-area-inset-top));
      right: 14px;
      left: 14px;
      z-index: 900;
    }

    .search-box {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 15px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(221, 228, 222, 0.9);
      border-radius: 20px;
      box-shadow: 0 8px 22px rgba(27, 57, 37, 0.12);
      backdrop-filter: blur(14px);
    }

    .search-box i {
      flex: 0 0 auto;
      width: 20px;
      color: #8a978f;
    }

    .search-box input {
      width: 100%;
      margin-left: 10px;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 15px;
    }

    .search-box input::placeholder {
      color: #96a198;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      padding: 0 1px 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      flex: 0 0 auto;
      height: 40px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(27, 57, 37, 0.08);
      cursor: pointer;
    }

    .filter-chip.active {
      color: #1a5424;
      background: var(--primary-soft);
      border-color: #bcefac;
    }

    /* จำนวนสนาม */
    .result-pill {
      position: absolute;
      top: calc(200px + env(safe-area-inset-top));
      left: 50%;
      z-index: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: calc(100% - 30px);
      padding: 8px 15px;
      color: #536158;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(221, 228, 222, 0.9);
      border-radius: 999px;
      box-shadow: 0 5px 15px rgba(27, 57, 37, 0.1);
      transform: translateX(-50%);
      white-space: nowrap;
      backdrop-filter: blur(12px);
      font-size: 12px;
    }

    .result-pill strong {
      color: var(--primary-dark);
    }

    /* หมุดสนาม */
    .run-marker {
      position: relative;
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      background: var(--yellow);
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 6px;
      box-shadow: 0 5px 14px rgba(35, 49, 38, 0.22);
      transform: rotate(-45deg);
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .run-marker span {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      color: #14341f;
      background: #fff8d7;
      border-radius: 50%;
      transform: rotate(45deg);
    }

    .run-marker span svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.5;
    }

    .run-marker.selected {
      background: #148846;
      transform: rotate(-45deg) scale(1.1);
      box-shadow: 0 7px 18px rgba(20, 136, 70, 0.32);
    }

    .run-marker.selected span {
      color: #0c6635;
      background: #dff8d4;
    }

    .run-marker.free {
      background: var(--primary);
    }

    .user-marker {
      width: 18px;
      height: 18px;
      background: #2688ff;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(38, 136, 255, 0.2), 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    /* ปุ่มด้านขวา */
    .map-actions {
      position: absolute;
      right: 14px;
      bottom: calc(100px + env(safe-area-inset-bottom));
      z-index: 850;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .circle-button {
      display: grid;
      width: 48px;
      height: 48px;
      padding: 0;
      place-items: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 50%;
      box-shadow: 0 6px 16px rgba(27, 57, 37, 0.15);
      cursor: pointer;
    }

    .circle-button i {
      width: 20px;
    }

    .add-place {
      position: absolute;
      right: 14px;
      bottom: calc(158px + env(safe-area-inset-bottom));
      z-index: 850;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      color: #123a20;
      font-weight: 800;
      font-size: 13px;
      background: var(--primary);
      border: 0;
      border-radius: 18px;
      box-shadow: 0 10px 22px rgba(81, 188, 57, 0.3);
      cursor: pointer;
    }

    .add-place i {
      width: 18px;
    }

    /* การ์ดรายละเอียด */
    .detail-card {
      position: absolute;
      right: 10px;
      bottom: calc(76px + env(safe-area-inset-bottom));
      left: 10px;
      z-index: 1100;
      padding: 16px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(222, 230, 223, 0.95);
      border-radius: 26px;
      box-shadow: var(--shadow);
      transform: translateY(calc(100% + 120px));
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
      backdrop-filter: blur(16px);
    }

    .detail-card.open {
      transform: translateY(0);
      opacity: 1;
    }

    .card-handle {
      width: 40px;
      height: 4px;
      margin: -6px auto 12px;
      background: #d6ddd7;
      border-radius: 99px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .place-icon {
      display: grid;
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      place-items: center;
      color: #174426;
      background: var(--primary);
      border-radius: 16px;
    }

    .place-icon i {
      width: 26px;
      height: 26px;
    }

    .place-heading {
      min-width: 0;
      flex: 1;
    }

    .place-heading h2 {
      margin: 1px 0 3px;
      overflow: hidden;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .place-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .close-button {
      display: grid;
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      color: #5f6d64;
      background: #f6f8f6;
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
    }

    .close-button i {
      width: 18px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      color: #516158;
      font-size: 12px;
      font-weight: 700;
      background: #f3f6f3;
      border-radius: 999px;
    }

    .status.open {
      color: #16753a;
      background: #e2f7dc;
    }

    .status i {
      width: 14px;
      height: 14px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }

    .fact {
      min-width: 0;
      padding: 9px 6px;
      text-align: center;
      background: #f3f6f3;
      border-radius: 14px;
    }

    .fact i {
      width: 18px;
      height: 18px;
      color: #2b7a3c;
    }

    .fact strong {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.2;
    }

    .fact span {
      display: block;
      margin-top: 1px;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 42px;
      gap: 6px;
      margin-top: 12px;
    }

    .outline-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 800;
      background: #fff;
      border: 1px solid #d6ded7;
      border-radius: 14px;
      cursor: pointer;
    }

    .outline-button i {
      width: 15px;
    }

    .outline-button.report {
      color: var(--danger);
    }

    .primary-actions {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 8px;
      margin-top: 8px;
    }

    .large-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 46px;
      font-size: 14px;
      font-weight: 800;
      background: #fff;
      border: 1px solid #d6ded7;
      border-radius: 16px;
      cursor: pointer;
    }

    .large-button.primary {
      color: #153c21;
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(115, 220, 75, 0.25);
    }

    .large-button i {
      width: 18px;
    }

    /* เมนูด้านล่าง */
    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 1000;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: calc(70px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 255, 255, 0.97);
      border-top: 1px solid rgba(221, 228, 222, 0.9);
      backdrop-filter: blur(16px);
      align-items: center;
    }

    .nav-item {
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      color: #859188;
      font-size: 11px;
      font-weight: 700;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .nav-icon {
      display: grid;
      width: 40px;
      height: 32px;
      place-items: center;
      border-radius: 12px;
    }

    .nav-icon i {
      width: 20px;
      height: 20px;
    }

    .nav-item.active {
      color: #28772d;
    }

    .nav-item.active .nav-icon {
      color: #2e9b36;
      background: var(--primary-soft);
    }

    /* Toast */
    .toast {
      position: absolute;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      z-index: 1500;
      max-width: calc(100% - 30px);
      padding: 10px 15px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      background: rgba(19, 41, 28, 0.93);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(19, 41, 28, 0.22);
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: 0.22s ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="header-logo">
        <i data-lucide="footprints"></i>
      </div>
      <h1>RunNear TH</h1>
    </header>

    <section class="search-panel">
      <label class="search-box">
        <i data-lucide="search"></i>
        <input
          id="searchInput"
          type="search"
          placeholder="ค้นหาสวน สนามกีฬา หรือจังหวัด"
        />
      </label>

      <div class="filters">
        <button class="filter-chip active" data-filter="all">ทั้งหมด</button>
        <button class="filter-chip" data-filter="near">ใกล้ฉัน</button>
        <button class="filter-chip" data-filter="free">ใช้ฟรี</button>
        <button class="filter-chip" data-filter="light">มีไฟ</button>
        <button class="filter-chip" data-filter="rubber">พื้นยาง</button>
        <button class="filter-chip" data-filter="parking">มีที่จอดรถ</button>
      </div>
    </section>

    <div class="result-pill">
      <i data-lucide="map-pin"></i>
      พบสนามวิ่ง <strong id="resultCount">0</strong> แห่ง
    </div>

    <div id="map"></div>

    <button class="add-place" id="addPlaceButton">
      <i data-lucide="map-pin-plus"></i>
      เพิ่มสนามวิ่ง
    </button>

    <div class="map-actions">
      <button class="circle-button" id="locateButton" aria-label="ตำแหน่งของฉัน">
        <i data-lucide="locate-fixed"></i>
      </button>
    </div>

    <article class="detail-card" id="detailCard">
      <div class="card-handle"></div>

      <div class="card-top">
        <div class="place-icon">
          <i data-lucide="footprints"></i>
        </div>

        <div class="place-heading">
          <h2 id="placeName">สวนลุมพินี</h2>
          <p id="placeLocation">กรุงเทพมหานคร</p>
        </div>

        <button class="close-button" id="closeCard" aria-label="ปิด">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="status-row">
        <span class="status open">
          <i data-lucide="clock-3"></i>
          เปิดอยู่
        </span>
        <span class="status">
          <i data-lucide="users"></i>
          คนปานกลาง
        </span>
        <span class="status">
          <i data-lucide="star"></i>
          <span id="placeRating">4.8</span>
        </span>
      </div>

      <div class="facts">
        <div class="fact">
          <i data-lucide="route"></i>
          <strong id="placeDistance">2.5 กม.</strong>
          <span>ระยะทางต่อรอบ</span>
        </div>

        <div class="fact">
          <i data-lucide="layers-3"></i>
          <strong id="placeSurface">พื้นยาง</strong>
          <span>พื้นผิวสนาม</span>
        </div>

        <div class="fact">
          <i data-lucide="lightbulb"></i>
          <strong id="placeLight">มีไฟ</strong>
          <span>ช่วงกลางคืน</span>
        </div>
      </div>

      <div class="card-actions">
        <button class="outline-button" id="reviewButton">
          <i data-lucide="pencil"></i>
          รีวิว
        </button>

        <button class="outline-button report" id="reportButton">
          <i data-lucide="flag"></i>
          แจ้งข้อมูล
        </button>

        <button class="outline-button" id="shareButton" aria-label="แชร์">
          <i data-lucide="share-2"></i>
        </button>
      </div>

      <div class="primary-actions">
        <button class="large-button" id="detailButton">
          ดูรายละเอียด
        </button>

        <button class="large-button primary" id="navigateButton">
          <i data-lucide="navigation"></i>
          นำทาง
        </button>
      </div>
    </article>

    <nav class="bottom-nav">
      <button class="nav-item">
        <span class="nav-icon">
          <i data-lucide="house"></i>
        </span>
        หน้าแรก
      </button>

      <button class="nav-item active">
        <span class="nav-icon">
          <i data-lucide="map"></i>
        </span>
        แผนที่
      </button>

      <button class="nav-item">
        <span class="nav-icon">
          <i data-lucide="search"></i>
        </span>
        ค้นหา
      </button>

      <button class="nav-item">
        <span class="nav-icon">
          <i data-lucide="user-round"></i>
        </span>
        โปรไฟล์
      </button>
    </nav>

    <div class="toast" id="toast"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <script>
    lucide.createIcons();

    // ฐานข้อมูลสนามวิ่งจริง (จัดเต็ม กทม. ทุกจุดฮิต และครบทุกจังหวัดทั่วไทย)
    const runningPlaces = [
      // กรุงเทพมหานคร (จัดเต็มทุกสวนยอดฮิต)
      { id: 1, name: "สวนลุมพินี", area: "กรุงเทพมหานคร (ปทุมวัน)", lat: 13.7306, lng: 100.5416, distance: "2.5 กม.", surface: "พื้นยาง/ถนน", lightLabel: "มีไฟส่องสว่าง", rating: "4.8", near: true, free: true, light: true, rubber: true, parking: true },
      { id: 2, name: "สวนเบญจกิติ", area: "กรุงเทพมหานคร (คลองเตย)", lat: 13.7264, lng: 100.5581, distance: "1.8 กม.", surface: "พื้นปูน/ยาง", lightLabel: "มีไฟส่องสว่าง", rating: "4.9", near: true, free: true, light: true, rubber: false, parking: true },
      { id: 3, name: "สวนวชิรเบญจทัศ (สวนรถไฟ)", area: "กรุงเทพมหานคร (จตุจักร)", lat: 13.8126, lng: 100.5521, distance: "3.0 กม.", surface: "ทางลาดยาง", lightLabel: "มีไฟส่องสว่าง", rating: "4.8", near: true, free: true, light: true, rubber: false, parking: true },
      { id: 4, name: "อุทยานสวนจตุจักร", area: "กรุงเทพมหานคร (จตุจักร)", lat: 13.8104, lng: 100.5554, distance: "3.0 กม.", surface: "ทางปูน/ยาง", lightLabel: "มีไฟส่องสว่าง", rating: "4.7", near: true, free: true, light: true, rubber: false, parking: true },

      { id: 83, name: "สวนสมเด็จพระศรีนครินทร์ ปัตตานี", area: "ปัตตานี (เมือง)", lat: 6.8680, lng: 101.2500, distance: "1.2 กม.", surface: "ทางปูน", lightLabel: "มีไฟส่องสว่าง", rating: "4.5", near: false, free: true, light: true, rubber: false, parking: true },
      { id: 84, name: "สวนขวัญเมือง", area: "ยะลา (เมือง)", lat: 6.5410, lng: 101.2820, distance: "1.5 กม.", surface: "ทางปูน", lightLabel: "มีไฟส่องสว่าง", rating: "4.6", near: false, free: true, light: true, rubber: false, parking: true },
      { id: 85, name: "สวนเฉลิมพระเกียรติ 6 รอบ", area: "นราธิวาส (เมือง)", lat: 6.4250, lng: 101.8150, distance: "1.0 กม.", surface: "ทางปูน", lightLabel: "มีไฟส่องสว่าง", rating: "4.4", near: false, free: true, light: true, rubber: false, parking: true }
    ];

    const map = L.map("map", {
      zoomControl: false,
      attributionControl: true
    }).setView([13.7508, 100.5367], 6);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    const detailCard = document.getElementById("detailCard");
    const resultCount = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const toast = document.getElementById("toast");

    let activeFilter = "all";
    let selectedPlace = null;
    let userLocationMarker = null;
    let toastTimer;

    const markerLayer = L.layerGroup().addTo(map);
    const markerObjects = new Map();

    function markerHTML(place, selected = false) {
      const classes = [
        "run-marker",
        place.free ? "free" : "",
        selected ? "selected" : ""
      ].join(" ");

      return `
        <div class="${classes}">
          <span>
            <i data-lucide="person-standing"></i>
          </span>
        </div>
      `;
    }

    function createMarkerIcon(place, selected = false) {
      return L.divIcon({
        className: "",
        html: markerHTML(place, selected),
        iconSize: [48, 48],
        iconAnchor: [24, 45]
      });
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    function updateCard(place) {
      selectedPlace = place;

      document.getElementById("placeName").textContent = place.name;
      document.getElementById("placeLocation").textContent = place.area;
      document.getElementById("placeRating").textContent = place.rating;
      document.getElementById("placeDistance").textContent = place.distance;
      document.getElementById("placeSurface").textContent = place.surface;
      document.getElementById("placeLight").textContent = place.lightLabel;

      markerObjects.forEach((marker, id) => {
        const markerPlace = runningPlaces.find(item => item.id === id);
        if (markerPlace) {
          marker.setIcon(
            createMarkerIcon(markerPlace, markerPlace.id === place.id)
          );
        }
      });

      lucide.createIcons();
      detailCard.classList.add("open");

      map.setView([place.lat, place.lng], 14, {
        animate: true,
        duration: 0.5
      });
    }

    function renderMarkers(places) {
      markerLayer.clearLayers();
      markerObjects.clear();
      resultCount.textContent = places.length;

      places.forEach(place => {
        const marker = L.marker(
          [place.lat, place.lng],
          { icon: createMarkerIcon(place, false) }
        );

        marker.on("click", () => updateCard(place));
        marker.addTo(markerLayer);
        markerObjects.set(place.id, marker);
      });

      lucide.createIcons();
    }

    function filterPlaces() {
      const keyword = searchInput.value.trim().toLowerCase();

      const filtered = runningPlaces.filter(place => {
        const matchesText =
          place.name.toLowerCase().includes(keyword) ||
          place.area.toLowerCase().includes(keyword);

        const matchesFilter =
          activeFilter === "all" ||
          Boolean(place[activeFilter]);

        return matchesText && matchesFilter;
      });

      detailCard.classList.remove("open");
      selectedPlace = null;
      renderMarkers(filtered);

      if (keyword && filtered.length === 0) {
        showToast("ไม่พบสนามวิ่งที่ค้นหา");
      }
    }

    document.querySelectorAll(".filter-chip").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter-chip").forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");
        activeFilter = button.dataset.filter;
        filterPlaces();
      });
    });

    searchInput.addEventListener("input", filterPlaces);

    document.getElementById("closeCard").addEventListener("click", () => {
      detailCard.classList.remove("open");
      selectedPlace = null;
    });

    document.getElementById("locateButton").addEventListener("click", () => {
      if (!navigator.geolocation) {
        showToast("อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง");
        return;
      }

      showToast("กำลังค้นหาตำแหน่งของคุณ");

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          if (userLocationMarker) {
            map.removeLayer(userLocationMarker);
          }

          userLocationMarker = L.marker([lat, lng], {
            icon: L.divIcon({
              className: "",
              html: '<div class="user-marker"></div>',
              iconSize: [18, 18],
              iconAnchor: [9, 9]
            })
          }).addTo(map);

          map.setView([lat, lng], 14);
          showToast("พบตำแหน่งของคุณแล้ว");
        },
        () => {
          showToast("กรุณาอนุญาตให้เว็บไซต์เข้าถึงตำแหน่ง");
        },
        {
          enableHighAccuracy: true,
          timeout: 10000
        }
      );
    });

    document.getElementById("navigateButton").addEventListener("click", () => {
      if (!selectedPlace) return;

      const url =
        `https://www.google.com/maps/dir/?api=1` +
        `&destination=${selectedPlace.lat},${selectedPlace.lng}`;

      window.open(url, "_blank");
    });

    document.getElementById("shareButton").addEventListener("click", async () => {
      if (!selectedPlace) return;

      const shareData = {
        title: selectedPlace.name,
        text: `สนามวิ่ง ${selectedPlace.name} พื้นที่ ${selectedPlace.area}`,
        url: `https://www.google.com/maps?q=${selectedPlace.lat},${selectedPlace.lng}`
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(shareData.url);
          showToast("คัดลอกลิงก์สนามวิ่งแล้ว");
        }
      } catch (error) {}
    });

    document.getElementById("reviewButton").addEventListener("click", () => {
      showToast("ระบบรีวิวจะเปิดใช้งานเร็วๆ นี้");
    });

    document.getElementById("reportButton").addEventListener("click", () => {
      showToast("เปิดแบบฟอร์มแจ้งแก้ไขข้อมูลสนาม");
    });

    document.getElementById("detailButton").addEventListener("click", () => {
      showToast("เปิดหน้ารายละเอียดสนามวิ่ง");
    });

    document.getElementById("addPlaceButton").addEventListener("click", () => {
      showToast("กดตำแหน่งบนแผนที่เพื่อเพิ่มสนามวิ่ง");
    });

    document.querySelectorAll(".nav-item").forEach(item => {
      item.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(nav => {
          nav.classList.remove("active");
        });

        item.classList.add("active");

        if (!item.textContent.includes("แผนที่")) {
          showToast("เมนูนี้จะพัฒนาในหน้าถัดไป");
        }
      });
    });

    renderMarkers(runningPlaces);

    setTimeout(() => {
      updateCard(runningPlaces[0]);
    }, 650);
  </script>
